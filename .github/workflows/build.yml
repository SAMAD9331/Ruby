name: Build Signed APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/ruby-release.keystore

      - name: Build Signed APK
        run: |
          GRADLEW=$(find. -name "gradlew" -type f | head -n 1)
          chmod +x $GRADLEW
          $GRADLEW assembleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/ruby-release.keystore -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Ruby-Signed-APK
          path: "**/app/build/outputs/apk/release/*.apk"
